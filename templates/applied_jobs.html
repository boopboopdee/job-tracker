{% extends "base.html" %}


{% block content %}

<h1>📄 Applied Jobs</h1>


{% for job in jobs %}

<div class="job-card">

<h3>{{ job["title"] }}</h3>

<p>{{ job["company"] }}</p>

<p>Status: {{ job["status"] }}</p>

<p>{{ job["notes"] }}</p>


<a href="{{ job["url"] }}" target="_blank">
View Job
</a>

</div>


{% endfor %}


{% endblock %}
