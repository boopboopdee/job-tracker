{% extends "base.html" %}


{% block content %}


<h1>

{{company.name}} Scan Results

</h1>


<hr>


{% if jobs %}


<h2>

{{jobs|length}} Jobs Found

</h2>


{% for job in jobs %}


<div class="job-card">


<h3>

{{job.title}}

</h3>


<p>

Location:

{{job.location}}

</p>


<a href="{{job.url}}" target="_blank">

View Job

</a>


</div>


{% endfor %}


{% else %}


<h2>

No matching jobs found

</h2>


{% endif %}


{% endblock %}
